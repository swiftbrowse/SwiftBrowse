[workspace]
resolver = "2"
members = ["crates/core", "crates/chromium", "crates/mcp", "crates/cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
swiftbrowse-core = { path = "crates/core" }
swiftbrowse-chromium = { path = "crates/chromium" }
swiftbrowse-mcp = { path = "crates/mcp" }
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "fs", "net", "signal"] }
tokio-tungstenite = "0.26"
libc = "0.2"
url = "2"

[profile.release]
# Smaller downloads for the released binaries.
strip = true
lto = "thin"
