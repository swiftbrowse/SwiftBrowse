name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Run the Playwright benchmark
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned Chromium build, same as the benchmark's Playwright version.
      - run: npx -y playwright@1.64.0 install --with-deps chromium chromium-headless-shell ffmpeg
      - run: cargo run -q -p swiftbrowse-cli -- doctor
      - run: cargo test --workspace
      # Shows how this platform's screencast behaves (streamed vs filled-in frames).
      - run: cargo test -p swiftbrowse-chromium --test browser video -- --nocapture
      # The SDKs are generated from the engine's schemas: they must match it.
      - run: |
          node sdk/typescript/scripts/generate.mjs target/debug/swiftbrowse
          python3 sdk/python/scripts/generate.py target/debug/swiftbrowse
          git diff --exit-code sdk
      - run: node --test
        working-directory: sdk/typescript
      - run: npx -y -p typescript@5.6.3 tsc -p test/tsconfig.json
        working-directory: sdk/typescript
      - run: python3 -m unittest discover -s tests -v
        working-directory: sdk/python

  test-other:
    strategy:
      # One OS failing must not cancel the others: each is evidence.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npx -y playwright@1.64.0 install chromium chromium-headless-shell ffmpeg
      - run: cargo run -q -p swiftbrowse-cli -- doctor
      - run: cargo test --workspace
      # Shows how this platform's screencast behaves (streamed vs filled-in frames).
      - run: cargo test -p swiftbrowse-chromium --test browser video -- --nocapture

  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: npx -y playwright@1.64.0 install --with-deps chromium
      - run: cargo build --release
      - run: npm ci || npm install
        working-directory: bench
      - run: node bench.mjs ../target/release/swiftbrowse --iter 50 --cold 10
        working-directory: bench
      - run: node agents.mjs ../target/release/swiftbrowse --iter 15 --cold 10
        working-directory: bench
      - run: node e2e.mjs ../target/release/swiftbrowse --iter 5
        working-directory: bench
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
